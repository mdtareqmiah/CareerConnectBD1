<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#f0f0f0"/>
  <g transform="translate(50, 60)">
    <!-- Building shape -->
    <rect x="0" y="20" width="100" height="60" fill="#c0c0c0" stroke="#999" stroke-width="1"/>
    
    <!-- Windows row 1 -->
    <rect x="10" y="30" width="12" height="12" fill="#e0e0e0" stroke="#999" stroke-width="0.5"/>
    <rect x="28" y="30" width="12" height="12" fill="#e0e0e0" stroke="#999" stroke-width="0.5"/>
    <rect x="46" y="30" width="12" height="12" fill="#e0e0e0" stroke="#999" stroke-width="0.5"/>
    <rect x="64" y="30" width="12" height="12" fill="#e0e0e0" stroke="#999" stroke-width="0.5"/>
    
    <!-- Windows row 2 -->
    <rect x="10" y="48" width="12" height="12" fill="#e0e0e0" stroke="#999" stroke-width="0.5"/>
    <rect x="28" y="48" width="12" height="12" fill="#e0e0e0" stroke="#999" stroke-width="0.5"/>
    <rect x="46" y="48" width="12" height="12" fill="#e0e0e0" stroke="#999" stroke-width="0.5"/>
    <rect x="64" y="48" width="12" height="12" fill="#e0e0e0" stroke="#999" stroke-width="0.5"/>
    
    <!-- Door -->
    <rect x="39" y="65" width="22" height="15" fill="#8b7355" stroke="#5d4e37" stroke-width="0.5"/>
    <circle cx="59" cy="72.5" r="1.5" fill="#d4af37"/>
  </g>
</svg>
